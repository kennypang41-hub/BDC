name: Harvest BDC marks

# The extraction needs to reach sec.gov. Any network that blocks it — a
# corporate proxy, a sandboxed agent — cannot run the pipeline, so run it here:
# GitHub's runners have open egress, and the outputs come back as artifacts.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First quarter of SEC bulk data, e.g. 2023Q4"
        required: true
        default: "2023Q4"
      end:
        description: "Last quarter. Blank means the newest published."
        required: false
        default: ""
      tickers:
        description: "Comma-separated subset, e.g. ARCC,TSLX. Blank means all 43."
        required: false
        default: ""
      identity:
        description: "Contact for the SEC User-Agent (Name email). Falls back to the EDGAR_IDENTITY secret."
        required: false
        default: ""
      publish_exports:
        description: "Also push the workbook and site to the `exports` branch (artifact downloads need blob storage, which some networks block)."
        type: boolean
        required: false
        default: false
  schedule:
    # BDCs file 10-Qs through the quarter's second month; pick up new marks then.
    - cron: "0 6 5 3,6,9,12 *"

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[web,dev]"

      - name: Resolve SEC identity
        id: identity
        env:
          INPUT_IDENTITY: ${{ inputs.identity }}
          SECRET_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
        run: |
          IDENTITY="${INPUT_IDENTITY:-$SECRET_IDENTITY}"
          if [ -z "$IDENTITY" ]; then
            echo "::error::The SEC rejects unidentified requests. Set the EDGAR_IDENTITY secret" \
                 "(Settings > Secrets > Actions) or pass the identity input, as 'Name email@example.com'."
            exit 1
          fi
          echo "::add-mask::$IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      # The SEC bulk data sets are ~50 MB a quarter and rarely change once
      # published, so reuse them across runs rather than re-downloading.
      - name: Restore SEC data set cache
        uses: actions/cache@v4
        with:
          path: data/cache/dera
          key: dera-${{ inputs.start }}-${{ inputs.end }}-${{ github.run_id }}
          restore-keys: |
            dera-${{ inputs.start }}-${{ inputs.end }}-
            dera-

      - name: Check EDGAR is reachable
        env:
          EDGAR_IDENTITY: ${{ steps.identity.outputs.identity }}
        run: bdc doctor

      # The bulk data sets first, on their own. They carry the history in a
      # handful of requests, so this finishes in minutes and guarantees there is
      # a dataset to upload even if the slower filing pass runs long.
      #
      # Inputs arrive as environment variables rather than being interpolated
      # into the script: a `${{ }}` expansion lands in the shell verbatim, so a
      # crafted input would run as a command.
      - name: Harvest the SEC bulk data sets
        timeout-minutes: 45
        env:
          EDGAR_IDENTITY: ${{ steps.identity.outputs.identity }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          TICKERS: ${{ inputs.tickers }}
        run: |
          args=(--start "$START" --no-filings -v)
          if [ -n "$END" ]; then
            args+=(--end "$END")
          fi
          if [ -n "$TICKERS" ]; then
            args+=(--tickers "$TICKERS")
          fi
          bdc harvest "${args[@]}"

      # Best-effort, and allowed to fail. The bulk data sets carry principal but
      # no fair value, so on their own there may be no mark to export at all —
      # and an early safety upload must never stop the filing pass, which is
      # where every valuation actually comes from.
      - name: Build the exports
        id: early_export
        continue-on-error: true
        run: |
          bdc stats
          bdc excel --out data/bdc-marks.xlsx
          bdc bundle --out data/bdc-tracker.html
          bdc export --out data/export

      - name: Upload
        if: steps.early_export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bdc-marks
          path: |
            data/bdc-marks.xlsx
            data/bdc-tracker.html
            data/bdc.db
            data/export
          retention-days: 30
          if-no-files-found: error

      # DERA lags filings by about a quarter, so the newest marks only exist in
      # the filings themselves. Bounded: this is a top-up, not a second harvest.
      - name: Top up the newest quarter from filings
        id: topup
        continue-on-error: true
        timeout-minutes: 75
        env:
          EDGAR_IDENTITY: ${{ steps.identity.outputs.identity }}
          TICKERS: ${{ inputs.tickers }}
        run: |
          args=(--no-dera --limit-per-bdc 2 --workers 6 -v)
          if [ -n "$TICKERS" ]; then
            args+=(--tickers "$TICKERS")
          fi
          bdc harvest --start "${{ inputs.start }}" "${args[@]}"

      # This one must work: it is the export that carries the marks.
      - name: Rebuild the exports with the newest quarter
        if: steps.topup.outcome == 'success'
        run: |
          bdc excel --out data/bdc-marks.xlsx
          bdc bundle --out data/bdc-tracker.html
          bdc export --out data/export

      - name: Summarise what landed
        if: always()
        run: |
          bdc stats
          {
            echo '## Marks extracted'
            echo '```'
            bdc stats
            echo '```'
            echo "Filing top-up: ${{ steps.topup.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the final dataset
        if: steps.topup.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bdc-marks-with-latest-quarter
          path: |
            data/bdc-marks.xlsx
            data/bdc-tracker.html
            data/bdc.db
            data/export
          retention-days: 30
          if-no-files-found: error

      # Artifact downloads redirect to blob storage, which a restrictive network
      # may refuse even where the GitHub API itself is reachable. An orphan
      # branch carries the outputs over plain git instead. Force-pushed, so it
      # holds one copy rather than accumulating a run's worth every time.
      - name: Publish the exports to the `exports` branch
        if: inputs.publish_exports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh data/bdc-marks.xlsx data/bdc-tracker.html
          workdir=$(mktemp -d)
          cp data/bdc-marks.xlsx data/bdc-tracker.html "$workdir"/
          cd "$workdir"
          {
            echo "# BDC mark exports"
            echo
            echo "Generated by run ${{ github.run_id }} from ${{ github.sha }} on $(date -u +%Y-%m-%dT%H:%MZ)."
            echo
            echo '```'
            cd - >/dev/null && bdc stats && cd "$workdir"
            echo '```'
          } > README.md
          git init -q -b exports
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Exports from run ${{ github.run_id }}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" exports
