[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bdctracker"
version = "0.1.0"
description = "Extract loan-level valuation marks for US BDCs from SEC EDGAR filings and serve them as a tracker."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "edgartools>=5.53",
    "pandas>=2.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
bdc = "bdctracker.cli:app"

[tool.setuptools.packages.find]
include = ["bdctracker*"]

[tool.setuptools.package-data]
bdctracker = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
